name: Build and Release Desktop App

on:
  push:
    branches:
      - main  # Se ejecuta en cada push a main
  workflow_dispatch:  # Permite lanzarlo manualmente desde GitHub

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write  # Necesario para crear releases y subir assets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para contar commits y generar versión

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Auto-bump version based on commit count
        id: version
        shell: bash
        run: |
          # Genera una versión basada en el número de commits (ej: 1.0.42)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          NEW_VERSION="1.0.${COMMIT_COUNT}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          # Actualizar version en package.json sin hacer commit (solo para el build)
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='${NEW_VERSION}'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2));"
          echo "📦 Versión del build: ${NEW_VERSION}"

      - name: Build Electron App and Publish to GitHub Releases
        run: npx electron-builder --win --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Claves de Supabase requeridas para que electron-builder no falle
          NEXT_PUBLIC_SUPABASE_URL: "https://ehggcwosjsxlfbdpbsmo.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoZ2djd29zanN4bGZiZHBic21vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1NDgyNDMsImV4cCI6MjA4NTEyNDI0M30.zKprc8HE-biNHwZzt6joXIAP2ZXHRcHWJkFGUmMKWIQ"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        shell: bash
        run: |
          echo "## ✅ Build Completado" >> $GITHUB_STEP_SUMMARY
          echo "**Versión:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Archivo:** CasalenaPOS.exe" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** https://github.com/luigi123-bot/casalenaaaa/releases/latest" >> $GITHUB_STEP_SUMMARY
